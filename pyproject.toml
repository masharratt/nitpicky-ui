[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nitpicky"
version = "1.4.0"
description = "Pre-launch visual walkthrough: parallel lens agents find UI defects, a local portal to triage them, a checklist hand-off for the implementation team"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["qa", "accessibility", "playwright", "code-review", "triage", "claude"]

[project.scripts]
nitpicky = "nitpicky.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nitpicky = ["assets/*"]
